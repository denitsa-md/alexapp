<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexandras Alfabet Eventyr 🌟</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --grad-a: #667eea;
      --grad-b: #764ba2;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--grad-a) 0%, var(--grad-b) 100%);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 16px;
      transition: background 0.4s ease;
    }

    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 6px; height: 6px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
      opacity: 0.6;
    }

    @keyframes twinkle {
      from { opacity: 0.2; transform: scale(0.8); }
      to   { opacity: 0.9; transform: scale(1.2); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 800px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    header h1 {
      font-size: clamp(1rem, 3.5vw, 1.6rem);
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .score-bar {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .score-chip {
      background: rgba(255,255,255,0.2);
      border-radius: 50px;
      padding: 4px 14px;
      color: white;
      font-size: 0.85rem;
      font-weight: bold;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      white-space: nowrap;
    }

    .question-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      padding: 8px 8px 8px 20px;
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      gap: 12px;
    }

    .question-label {
      display: none;
    }

    .letter-display {
      font-size: clamp(4.5rem, 13vw, 7rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(255,220,80,0.8), 3px 3px 0 rgba(0,0,0,0.15);
      line-height: 1;
      cursor: pointer;
      transition: transform 0.15s;
      user-select: none;
      display: inline-block;
      flex-shrink: 0;
    }

    .letter-display:hover { transform: scale(1.08); }
    .letter-display:active { transform: scale(0.95); }

    .question-right {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .question-text {
      color: white;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      font-weight: 600;
    }

    .hint-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 12px;
      color: white;
      padding: 0 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      align-self: stretch;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 72px;
    }

    .hint-btn:hover { background: rgba(255,255,255,0.35); }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
      align-content: center;
    }

    /* Always keep 3 columns — never stack on mobile */
    @media (max-width: 480px) {
      header h1      { font-size: 1rem; flex: 0 0 100%; text-align: center; }
      header > div   { flex: 0 0 100%; justify-content: center; }
      .question-card { gap: 8px; padding: 6px 12px; }
      .letter-display { font-size: 4rem; }
      .question-text { font-size: 0.85rem; }
      .hint-btn      { font-size: 0.8rem; padding: 0 12px; }
      .choice-wrapper { gap: 4px; }
      .choice-btn    { gap: 6px; padding: 12px 6px 8px; border-radius: 14px; }
      .choice-media  { height: 80px; }
      .choice-emoji  { font-size: 2.2rem; }
      .choice-name   { font-size: 0.8rem; }
      .choice-type   { display: none; }
      .sound-btn     { font-size: 1rem; min-width: 90px; min-height: 46px; padding: 10px 16px; }
      .feedback-msg  { font-size: 0.9rem; }
      .next-btn      { font-size: 0.85rem; padding: 6px 16px; }
    }

    .choice-btn {
      background: white;
      border: none;
      border-radius: 18px;
      padding: 14px 8px 10px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .choice-btn:not(:disabled):hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 16px 32px rgba(0,0,0,0.2);
    }

    .choice-btn:not(:disabled):active { transform: scale(0.96); }

    .choice-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .choice-wrapper.correct .choice-btn {
      background: linear-gradient(135deg, #56ab2f, #a8e063);
      animation: pop 0.4s ease;
    }

    .choice-wrapper.wrong .choice-btn {
      background: linear-gradient(135deg, #ff6b6b, #ffa07a);
      animation: shake 0.4s ease;
    }

    .choice-btn:disabled { pointer-events: none; }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      40%     { transform: translateX(8px); }
      60%     { transform: translateX(-6px); }
      80%     { transform: translateX(6px); }
    }

    .choice-name {
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      font-weight: 700;
      color: #444;
    }

    .choice-type {
      font-size: 0.65rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sound-btn {
      background: #fff;
      border: 2px solid #667eea;
      border-radius: 50px;
      padding: 12px 22px;
      font-size: 1.1rem;
      color: #667eea;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      min-width: 100px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .sound-btn:active { background: rgba(102,126,234,0.12); }

    .choice-wrapper.correct .sound-btn { color: #2d6a0f; border-color: #56ab2f; }
    .choice-wrapper.wrong   .sound-btn { color: #7a1a1a; border-color: #ff6b6b; }

    .first-letter {
      color: #f7971e;
      font-size: 1.3em;
      font-weight: 900;
    }

    .choice-media {
      width: 100%;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 14px;
      overflow: hidden;
    }

    .choice-media.loading {
      background: rgba(0,0,0,0.07);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 0.9; }
    }

    .choice-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    .choice-emoji {
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      line-height: 1;
    }

    .theme-toggle-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      transition: background 0.2s;
    }

    .theme-toggle-btn:hover { background: rgba(255,255,255,0.35); }

    .lang-btn {
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }
    .lang-btn.active {
      background: rgba(255,255,255,0.35);
      border-color: white;
    }

    .theme-popup {
      display: none;
      position: fixed;
      background: rgba(30,20,60,0.92);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 12px 14px;
      gap: 10px;
      flex-wrap: wrap;
      z-index: 100;
      width: max-content;
    }

    .theme-popup.open { display: flex; }

    .theme-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .theme-dot:hover   { transform: scale(1.2); }
    .theme-dot.active  { border-color: white; transform: scale(1.15); }

    .alphabet-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      flex-shrink: 0;
      padding: 4px 2px;
    }

    .alpha-chip {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.65);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 0.75rem;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .alpha-chip.done {
      background: rgba(100,220,100,0.4);
      color: white;
      border-color: rgba(100,220,100,0.6);
    }

    .alpha-chip.current {
      background: rgba(255,220,80,0.8);
      color: #333;
      border-color: rgba(255,220,80,1);
      transform: scale(1.15);
    }

    @media (max-width: 480px) {
.alpha-chip { font-size: 0.65rem; padding: 2px 5px; }
    }

    .feedback {
      text-align: center;
      min-height: 44px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback-msg {
      font-size: clamp(1rem, 3vw, 1.4rem);
      font-weight: 800;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .next-btn {
      display: inline-block;
      margin-left: 12px;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      border: none;
      border-radius: 50px;
      color: #333;
      font-size: 1rem;
      font-weight: 800;
      padding: 8px 24px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255,180,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 1px;
      vertical-align: middle;
    }

    .next-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(255,180,0,0.5);
    }

    .confetti-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .star-burst-piece {
      position: fixed;
      font-size: 1.8rem;
      pointer-events: none;
      animation: starBurst linear forwards;
    }

    @keyframes starBurst {
      0%   { opacity: 1; transform: translate(0, 0) scale(0.3) rotate(0deg); }
      60%  { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot)); }
    }

    .streak-stars {
      font-size: 1.3rem;
      letter-spacing: 1px;
      color: #ffd200;
      text-shadow: 0 0 8px rgba(255,210,0,0.8);
      transition: transform 0.2s;
    }

    .milestone-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
    }

    .milestone-overlay.show {
      animation: milestoneAnim 1.8s ease forwards;
    }

    .milestone-text {
      font-size: clamp(2rem, 9vw, 4.5rem);
      font-weight: 900;
      color: #ffd200;
      text-shadow: 0 0 30px #ff9800, 0 0 60px rgba(255,210,0,0.8);
      text-align: center;
      line-height: 1.3;
    }

    @keyframes milestoneAnim {
      0%   { opacity: 0; transform: scale(0.3); }
      20%  { opacity: 1; transform: scale(1.1); }
      70%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }

  </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="confetti-container" id="confetti"></div>
<div class="milestone-overlay" id="milestone"></div>

<div class="container">
  <header>
    <h1 id="appTitle">🌟 Alexandras Alfabet 🌟</h1>
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
      <div class="score-bar">
        <div class="score-chip">⭐ <span id="score">0</span> <span id="pointsLabel">point</span></div>
        <div class="streak-stars" id="streakStars">☆☆☆☆☆</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
        <button class="lang-btn active" data-lang="da">🇩🇰</button>
        <button class="lang-btn" data-lang="bg">🇧🇬</button>
      </div>
      <button class="theme-toggle-btn" id="themeToggle" title="Vælg farvetema">🎨</button>
      <div class="theme-popup" id="themePicker"></div>
    </div>
  </header>

  <div class="question-card">
    <div class="letter-display" id="letterDisplay" title="Tryk for at høre bogstavet">A</div>
    <div class="question-right">
      <div class="question-text" id="questionText">Hvilken starter med "A"?</div>
    </div>
    <button class="hint-btn" id="hintBtn" onclick="playLetter()">🔊<br>Hør</button>
  </div>

  <div class="choices" id="choices"></div>

  <div class="feedback" id="feedback"></div>
  <div class="alphabet-strip" id="alphabetStrip"></div>
</div>

      ]

  let LANG = LANGS[localStorage.getItem('lang') || 'da'];
  let LETTERS = [...new Set(LANG.items.map(i => i.letter))];

  let score = 0;
  let streak = 0;
  let answered = false;
  let usedLetters = new Set();
  let currentLetter = '';
  let currentCorrect = null;

  // --- Stars background ---
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top  = Math.random() * 100 + 'vh';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    starsEl.appendChild(s);
  }

  // --- Speech ---
  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG.tts;
    u.rate = 0.85;
    u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  }

  function playLetter() {
    speak(currentLetter);
  }

  // --- Alphabet strip ---
  function renderStrip() {
    const strip = document.getElementById('alphabetStrip');
    strip.innerHTML = '';
    LANG.alphabet.forEach(l => {
      if (!LETTERS.includes(l)) return;
      const chip = document.createElement('div');
      chip.className = 'alpha-chip' +
        (usedLetters.has(l) ? ' done' : '') +
        (l === currentLetter ? ' current' : '');
      chip.textContent = l;
      strip.appendChild(chip);
    });
  }

  // --- Pick next round ---
  function pickLetter() {
    const available = LETTERS.filter(l => !usedLetters.has(l));
    if (available.length === 0) {
      usedLetters.clear();
      return pickLetter();
    }
    return available[Math.floor(Math.random() * available.length)];
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function newRound() {
    answered = false;
    document.getElementById('feedback').innerHTML = '';

    currentLetter = pickLetter();
    usedLetters.add(currentLetter);

    const correct = shuffle(LANG.items.filter(i => i.letter === currentLetter))[0];
    currentCorrect = correct;

    // Pick 2 distractors with different letters
    const distractorPool = shuffle(LANG.items.filter(i => i.letter !== currentLetter));
    const distractors = distractorPool.slice(0, 2);

    const choices = shuffle([correct, ...distractors]);

    document.getElementById('letterDisplay').textContent = currentLetter;
    document.getElementById('questionText').textContent =
      `${LANG.questionPrefix} "${currentLetter}"?`;

    renderChoices(choices);
    renderStrip();

    // Auto-announce the letter
    setTimeout(() => speak(currentLetter), 400);
  }

  // --- Wikipedia image loading ---
  const imgCache = {};

  async function fetchWikiImage(title) {
    if (imgCache[title] !== undefined) return imgCache[title];
    imgCache[title] = null; // mark as loading
    try {
      const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=300&origin=*`;
      const res = await fetch(url);
      const data = await res.json();
      const page = Object.values(data.query.pages)[0];
      imgCache[title] = page.thumbnail?.source || null;
    } catch { imgCache[title] = null; }
    return imgCache[title];
  }

  function renderChoices(choices) {
    const container = document.getElementById('choices');
    container.innerHTML = '';
    choices.forEach(item => {
      const wrapper = document.createElement('div');
      wrapper.className = 'choice-wrapper';

      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      const highlightedName = `<span class="first-letter">${item.name[0]}</span>${item.name.slice(1)}`;
      btn.innerHTML = `
        <div class="choice-media loading"></div>
        <span class="choice-name">${highlightedName}</span>
      `;
      btn.addEventListener('click', () => handleAnswer(wrapper, btn, item));

      const soundBtn = document.createElement('button');
      soundBtn.className = 'sound-btn';
      soundBtn.textContent = LANG.hearBtn;
      soundBtn.addEventListener('click', () => speak(item.name));

      wrapper.appendChild(btn);
      wrapper.appendChild(soundBtn);
      container.appendChild(wrapper);

      fetchWikiImage(item.wiki).then(src => {
        const media = btn.querySelector('.choice-media');
        if (!media) return;
        media.classList.remove('loading');
        if (src) {
          const img = document.createElement('img');
          img.className = 'choice-img';
          img.alt = item.name;
          img.onload = () => media.appendChild(img);
          img.onerror = () => { media.innerHTML = `<span class="choice-emoji">${item.emoji}</span>`; };
          img.src = src;
        } else {
          media.innerHTML = `<span class="choice-emoji">${item.emoji}</span>`;
        }
      });
    });
  }

  // --- Handle answer ---
  function handleAnswer(wrapper, btn, item) {
    if (answered) return;
    answered = true;

    const isCorrect = item.letter === currentLetter;
    const allBtns = document.querySelectorAll('.choice-btn');
    allBtns.forEach(b => { b.disabled = true; });

    if (isCorrect) {
      wrapper.classList.add('correct');
      score += 1 + Math.min(streak, 4);
      streak++;
      document.getElementById('score').textContent = score;
      updateStreakDisplay();
      checkMilestone(score);
      speak(item.name);
      showFeedback(true, item.name);
      launchStars();
    } else {
      wrapper.classList.add('wrong');
      streak = 0;
      updateStreakDisplay();
      speak(item.name);
      showFeedback(false, item.name);
      // Reveal correct
      document.querySelectorAll('.choice-wrapper').forEach(w => {
        if (w.querySelector('.choice-name').textContent === currentCorrect.name) {
          w.classList.add('correct');
        }
      });
    }
  }

  function showFeedback(correct, name) {
    const msgs = correct ? LANG.correct : LANG.wrong;
    const msg = msgs[Math.floor(Math.random() * msgs.length)];
    const fb = document.getElementById('feedback');
    fb.innerHTML = `<span class="feedback-msg">${msg}</span><button class="next-btn" onclick="newRound()">${LANG.nextBtn}</button>`;
  }

  // --- Star burst ---
  const STAR_COLORS = ['#ffd200','#ffec6e','#fff176','#ff9800','#ffffff','#ffe57f','#ffca28'];
  function launchStars() {
    const container = document.getElementById('confetti');
    container.innerHTML = '';
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 32; i++) {
      const p = document.createElement('div');
      p.className = 'star-burst-piece';
      const angle = (i / 32) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const dist = 120 + Math.random() * 180;
      p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      p.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
      p.style.setProperty('--rot', (Math.random() * 360) + 'deg');
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      p.style.color = STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)];
      p.textContent = '★';
      const dur = 0.8 + Math.random() * 0.6;
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      container.appendChild(p);
      setTimeout(() => p.remove(), (dur + 0.3) * 1000);
    }
  }

  // --- Streak display ---
  function updateStreakDisplay() {
    const filled = Math.min(streak, 5);
    document.getElementById('streakStars').textContent =
      '★'.repeat(filled) + '☆'.repeat(5 - filled);
  }

  // --- Milestone celebration ---
  function checkMilestone(newScore) {
    if (newScore > 0 && newScore % 5 === 0) {
      const el = document.getElementById('milestone');
      el.innerHTML = `<div class="milestone-text">⭐ ${newScore} stjerner! ⭐</div>`;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1900);
    }
  }

  // --- Themes ---
  const THEMES = [
    { name: 'Lilla',    a: '#667eea', b: '#764ba2' },
    { name: 'Solnedgang', a: '#f7971e', b: '#e040a0' },
    { name: 'Hav',      a: '#2193b0', b: '#6dd5ed' },
    { name: 'Skov',     a: '#11998e', b: '#38ef7d' },
    { name: 'Jordbær',  a: '#f953c6', b: '#b91d73' },
  ];

  function applyTheme(idx) {
    const t = THEMES[idx];
    document.body.style.background = `linear-gradient(135deg, ${t.a} 0%, ${t.b} 100%)`;
    document.querySelectorAll('.theme-dot').forEach((d, i) => {
      d.classList.toggle('active', i === idx);
    });
    localStorage.setItem('theme', idx);
  }

  function buildThemePicker() {
    const picker = document.getElementById('themePicker');
    THEMES.forEach((t, i) => {
      const dot = document.createElement('button');
      dot.className = 'theme-dot';
      dot.title = t.name;
      dot.style.background = `linear-gradient(135deg, ${t.a}, ${t.b})`;
      dot.addEventListener('click', () => { applyTheme(i); picker.classList.remove('open'); });
      picker.appendChild(dot);
    });
    const saved = parseInt(localStorage.getItem('theme') || '0', 10);
    applyTheme(saved);
  }

  buildThemePicker();

  // Theme popup toggle
  const themeToggle = document.getElementById('themeToggle');
  const themePopup  = document.getElementById('themePicker');
  themeToggle.addEventListener('click', () => {
    const isOpen = themePopup.classList.contains('open');
    themePopup.classList.toggle('open');
    if (!isOpen) {
      const rect = themeToggle.getBoundingClientRect();
      themePopup.style.top   = (rect.bottom + 8) + 'px';
      themePopup.style.right = (window.innerWidth - rect.right) + 'px';
    }
  });
  document.addEventListener('click', e => {
    if (!themeToggle.contains(e.target) && !themePopup.contains(e.target))
      themePopup.classList.remove('open');
  });

  // --- Language switcher ---
  function setLanguage(code) {
    LANG = LANGS[code];
    LETTERS = [...new Set(LANG.items.map(i => i.letter))];
    localStorage.setItem('lang', code);
    document.documentElement.lang = code;
    document.getElementById('appTitle').textContent = LANG.title;
    document.getElementById('pointsLabel').textContent = LANG.pointsLabel;
    document.querySelectorAll('.lang-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === code));
    usedLetters = new Set();
    score = 0; streak = 0;
    document.getElementById('score').textContent = 0;
    newRound();
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  // Apply saved language on load (sync UI without resetting score)
  const savedLang = localStorage.getItem('lang') || 'da';
  document.documentElement.lang = savedLang;
  document.getElementById('appTitle').textContent = LANG.title;
  document.getElementById('pointsLabel').textContent = LANG.pointsLabel;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === savedLang));

  // Register service worker for network-first cache busting
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  // Letter display click
  document.getElementById('letterDisplay').addEventListener('click', playLetter);

  // Start!
  newRound();
